<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - CivicFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 3rem auto;
        }

        .error {
            color: var(--danger);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="container auth-container card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary);">Register for CivicFix</h2>
        <div id="error-msg" class="error"></div>
        <form id="register-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="phone" class="form-control">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                errorMsg.innerText = 'Registering...';
                errorMsg.style.color = 'var(--gray)';
                const res = await API.register({ name, email, phone, password });
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } catch (err) {
                errorMsg.style.color = 'var(--danger)';
                errorMsg.innerText = err.message;
            }
        });
    </script>
</body>

</html>
